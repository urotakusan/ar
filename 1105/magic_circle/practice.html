<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
    <style>
        .hud{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="hud">
        
    </div>
    <a-scene hands id="scene">
        <a-gltf-model
            id="model"
            src="c_cyan.glb"
            animation-mixer="clip: MagicCircle_Loop"
            position="0 0.4 -3"
            rotation="-90 0 0"
            scale="2 2 2"
            ></a-gltf-model>

        <a-entity id="cyanpanel" position="-1.8 -0.8 -2">
            <a-plane
                color="cyan"
                opacity="0.8"
                width="0.9"
                height="0.35"
                rotation="-10 0 0"
                
            ></a-plane>
            <a-text 
                value="CYAN"
            ></a-text>
        </a-entity>

         <a-entity id="goldpanel" position="-0.6 -0.8 -2">
            <a-plane
                color="gold"
                opacity="0.8"
                width="0.9"
                height="0.35"
                rotation="-10 0 0"
                
            ></a-plane>
            <a-text 
                value="GOLD"
            ></a-text>
        </a-entity>

         <a-entity id="rosepanel" position="0.6 -0.8 -2">
            <a-plane
                color="pink"
                opacity="0.8"
                width="0.9"
                height="0.35"
                rotation="-10 0 0"
                
            ></a-plane>
            <a-text 
                value="ROSE"
            ></a-text>
        </a-entity>

         <a-entity id="violetpanel" position="1.8 -0.8 -2">
            <a-plane
                color="violet"
                opacity="0.8"
                width="0.9"
                height="0.35"
                rotation="-10 0 0"
                
            ></a-plane>
            <a-text 
                value="VIOLET"
            ></a-text>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>
    <script>
        const scene = document.getElementById("scene");
        const model = document.getElementById("model");

        const cyanpanel = document.getElementById("cyan-panel");
        const goldpanel = document.getElementById("gold-panel");
        const rosepanel = document.getElementById("rose-panel");
        const violetpanel = document.getElementById("violet-panel");
        const circleSound = new Audio("circle.mp3");
    </script>
</body>
</html>
