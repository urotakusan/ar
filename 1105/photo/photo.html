<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

</head>
<body>
    <a-scene hands id="scene">
        <a-image
            id="photo"
            src="p001.jpg"
            opacity="0.8"
            width="3.2"
            height="1.8"
            rotation="-10 0 0"
            position="0 0.5 -2">
        </a-image>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>
</body>

<script>
    const photos = [
        "p001.jpg",
        "p002.jpg",
        "p003.jpg"
    ]

    let index = 0;

    const scene = document.getElementById("scene");
    const photo = document.getElementById("photo");
    const touchSound = new Audio("touch.mp3");

    let wasInside = false;

    function changePhoto(){
        const inside = scene.components.hands.isPointOnEntity(8, photo);

        if(inside && !wasInside){
            index = (index + 1) % photos.length;
            photo.setAttribute("src", photos[index]);

            touchSound.currentTime = 0;
            touchSound.play();
        }
        wasInside = inside;
    }

    scene.addEventListener("hand-result", changePhoto);
</script>
</html>
