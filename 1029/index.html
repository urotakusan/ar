<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }
    </style>

</head>

<body>
    <div id="hud">
        <p>ROBOT HP:<span id="robotHpText">50</span></p>
        <progress id="robotHpBar" max="50" value="50"></progress>
        <br>
        <p>YOUR HP:<span id="yourHpText">50</span></p>
        <progress id="yourHpBar" max="50" value="50"></progress>
        <p id="gameOver"> 
    </div>
    <a-scene embedded 
             arjs="sourceType: webcam"
             cursor="rayOrigin: mouse"
             rayCaster="objects: .clickable">

        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5">
                <a-gltf-model 
                    id="robot" 
                    class="clickable"
                    src="robot.glb" 
                    position="0 0 0" 
                    scale="0.3 0.3 0.3" 
                    rotation="-90 0 0"
                    animation-mixer="clip: RobotArmature|Robot_Idle">
                </a-gltf-model>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const robotHpText = document.getElementById("robotHpText");
        const robotHpBar = document.getElementById("robotHpBar");
        const yourHpText = document.getElementById("yourHpText");
        const yourHpBar = document.getElementById("yourHpBar");

        let robotHp = 50;
        let yourHp = 50;

        const hitSound =new Audio("hit.mp3");
        const missSound = new Audio("miss.mp3");
        const deathSound = new Audio("death.mp3");
        const enemyhitSound = new Audio("enemy-attack.mp3"); 
        const avoidSound = new Audio("Avoid.mp3");
        const loseSound = new Audio("lose.mp3");


        function attack(){
            if(robotHp === 0 || yourHp === 0){
                return;
            }

            if(Math.random() < 0.3){
                missSound.play();
                return;
            }

           let damage = Math.floor(Math.random() * 10) + 1;
           robotHp -= damage;

            if(robotHp < 0){
                robotHp = 0;
            }
            robotHpText.textContent = robotHp;
            robotHpBar.value = robotHp;

            if(robotHp === 0){
                deathAnimation();
            }else{
                hitAnimation();
            }
            
        }
        
        function hitAnimation(){
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Jump",
                    loop: "once",
                }
            )
            hitSound.play();
        }

        function deathAnimation(){
            robot.removeAttribute("Animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Death",
                    loop: "once",
                    clampWhenFinished: true
                }
            )
            deathSound.play();
        }


        robot.addEventListener("click", attack);




        function enemyAttack(){
           

            if(Math.random() < 0.25){
                avoidSound.play();
                return;
            }

            let damage = Math.floor(Math.random() * 11) + 1;
            yourHp -= damage;

            if(yourHp < 0){
                yourHp = 0;
            }

            yourHpText.textContent = yourHp;
            yourHpBar.value = yourHp;

            if(yourHp === 0){
                loseSound.play();
                document.getElementById("gameOver").textContent = "GAME OVER";
            }else{
                enemyAnimation();
            }
        }

        function enemyAnimation(){
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip:"RobotArmature|Robot_Punch",
                    loop: "once",
                }
            )
            enemyhitSound.play();
        }

         robot.addEventListener("animation-finished", function(event){
                if(event.detail.action.getClip().name === "RobotArmature|Robot_Jump"){
                    enemyAttack();
                }
            })
    </script>
</body>

</html>
