<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud{
            position:fixed;
            top:20px;
            left:20px;
            z-index: 999;
        }

        button{
            font-size:20px;
            padding:12px 20px;
            border:none;
            background-color: royalblue;
            color:white;
            border-radius: 10px;
            margin-right: 10px;
        }

        select{
            font-size:18px;
            padding:10px 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <select id="animationSelect">
            <option value="CharacterArmature|Walk">あるく</option>
            <option value="CharacterArmature|Run">はしる</option>
            <option value="CharacterArmature|Roll">ころがる</option>
            <option value="CharacterArmature|Wave">てをふる</option>
            <option value="CharacterArmature|Death">かろうし</option>
        </select>
        <button id="enlargeButton">拡大</button>
        <button id="diminishButton">縮小</button>
        <button id="leftrotateButton">左回転</button>
        <button id="rightrotateButton">右回転</button>
    </div>
    <a-scene embedded arjs="sourceType: webcam">
        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5">
                <a-gltf-model 
                    id="businessman" 
                    src="BusinessMan.glb" 
                    position="0 0 0" 
                    scale="0.3 0.3 0.3" 
                    rotation="-90 0 0">
                </a-gltf-model>
            </a-entity>

        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const businessman = document.getElementById("businessman");
        const animationSelect = document.getElementById("animationSelect");
        const model = document.getElementById("model");
        const enlargeButton = document.getElementById("enlargeButton");
        const diminishButton = document.getElementById("diminishButton");
        const leftrotateButton = document.getElementById("leftrotateButton");
        const rightrotateButton = document.getElementById("rightrotateButton");

        let size = 1;

        function enlargeModel(){
            size = size + 0.1;
            model.setAttribute("scale", `${size} ${size} ${size}`);
        }

        enlargeButton.addEventListener("click", enlargeModel);

        function diminishModel(){
            size = size - 0.1;
            model.setAttribute("scale", `${size} ${size} ${size}`);
        }

        diminishButton.addEventListener("click", diminishModel);

        let angle = 0;

        function leftrotateModel(){
            angle += 15;
            model.setAttribute("rotation", `0 0 ${angle}`);
        }

        leftrotateButton.addEventListener("click", leftrotateModel);

        function rightrotateModel(){
            angle -= 15;
            model.setAttribute("rotation", `0 0 ${angle}`)
        }

        rightrotateButton.addEventListener("click", rightrotateModel);

        function changeAnimation(){
            businessman.setAttribute("animation-mixer", "clip", animationSelect.value);
        }

        animationSelect.addEventListener("change", changeAnimation);

    </script>
</body>
</html>
