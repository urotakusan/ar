<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
<style>
    #hud{
        position:fixed;
        left:20px;
        top:20px;
        z-index: 999;
    }
</style>
   
</head>
<body>
    <div id="hud">
        <button id="maidbutton">メイド召喚</button>
        <button id="robotbutton">ロボット召喚</button>
    </div>
    <a-scene hands>

        <a-entity hand-anchor="index:9">

            <a-gltf-model id="summonRune"></a-gltf-model>
            <a-gltf-model id="summonEntity"></a-gltf-model>
        </a-entity>
    </a-scene>
</body>

<script>
    const maidbutton = document.getElementById("maidbutton");
    const robotbutton = document.getElementById("robotbutton");
    const summonRune = document.getElementById("summonRune");
    const summonEntity = document.getElementById("summonEntity");

    const maidSound = new Audio("maid.mp3");
    const robotSound = new Audio("robo.mp3")

    function comeonMaid(){
        maidSound.play();
        summonRune.setAttribute("src", "c_rose.glb");
        summonRune.setAttribute("position", "0 1 0");
        summonRune.setAttribute("scale", "2.5 2.5 2.5");

        summonEntity.setAttribute("src", "woman.glb");
        summonEntity.setAttribute("position", "0 1 0");
        summonEntity.setAttribute("scale", "0.75 0.75 0.75");
    }

    maidbutton.addEventListener("click", comeonMaid);

    function comeonRobot(){
        robotSound.play();
        summonRune.setAttribute("src", "c_gold.glb");
        summonRune.setAttribute("position", "0 1 0");
        summonRune.setAttribute("scale", "2.75 2.75 2.75");

        summonEntity.setAttribute("src", "Robot.glb");
        summonEntity.setAttribute("position", "0 1 0");
        summonEntity.setAttribute("scale", "0.8 0.8 0.8");
    }

    robotbutton.addEventListener("click", comeonRobot);
</script>
</html>
